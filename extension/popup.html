<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LinkedIn Quiet</title><link rel="stylesheet" href="popup.css"></head><body>
<span class="eyebrow">LINKEDIN QUIET</span><h1>Your work.<br>A little quieter.</h1><p>Your profile, your posts, and their comments. Everything else stays masked.</p>
<form id="settings"><label for="profile">Your profile URL</label><input id="profile" type="url" required placeholder="https://www.linkedin.com/in/your-name/"><button>Save profile</button></form><p id="status" role="status"></p>
<nav hidden id="links"><a id="mine" target="_blank" rel="noopener">My profile ↗</a><a id="posts" target="_blank" rel="noopener">My posts ↗</a><a id="compose" href="https://www.linkedin.com/feed/?shareActive=true" target="_blank" rel="noopener">New post ↗</a></nav><small>Local settings. No analytics. No server.</small><script src="policy.js"></script><script src="popup.js"></script></body></html>
